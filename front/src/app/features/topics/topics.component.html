<section class="topics-screen">
  @if (loading()) {
    <p data-cy="topics-loading" class="topics-state">Chargement des thèmes...</p>
  } @else if (errorMessage()) {
    <p data-cy="topics-error" class="topics-state topics-state--error">{{ errorMessage() }}</p>
  } @else {
    <div data-cy="topics-list" class="topics-grid">
      @for (topic of topics(); track topic.id) {
        <app-topic-card
          [topic]="topic"
          [pending]="pendingTopicId() === topic.id"
          (toggle)="toggleSubscription($event)"
        ></app-topic-card>
      }
    </div>
  }
</section>
