<article class="topic-card mdd-surface-card">
  <h2>{{ topic().name }}</h2>
  <p>{{ topic().description }}</p>
  <button
    mat-flat-button
    type="button"
    class="mdd-btn subscribe-btn"
    [class.mdd-btn--primary]="!topic().subscribed"
    [class.mdd-btn--primary-muted]="topic().subscribed"
    [disabled]="pending()"
    (click)="onToggle()"
  >
    {{ topic().subscribed ? 'Déjà abonné' : 'S\'abonner' }}
  </button>
</article>
