<article class="topic-card mdd-surface-card" [attr.data-cy]="'topic-card-' + topic().id">
  <h2 data-cy="topic-name">{{ topic().name }}</h2>
  <p>{{ topic().description }}</p>
  <button
    [attr.data-cy]="'topic-toggle-' + topic().id"
    mat-flat-button
    type="button"
    class="mdd-btn subscribe-btn"
    [class.mdd-btn--primary]="!topic().subscribed"
    [class.mdd-btn--primary-muted]="topic().subscribed"
    [disabled]="pending()"
    (click)="onToggle()"
  >
    {{ topic().subscribed ? 'Déjà abonné' : 'S\'abonner' }}
  </button>
</article>
