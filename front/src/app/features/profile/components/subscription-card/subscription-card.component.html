<article class="subscription-card mdd-surface-card" [attr.data-cy]="'subscription-card-' + topic().id">
  <h3 data-cy="subscription-name">{{ topic().name }}</h3>
  <p>{{ topic().description }}</p>
  <button
    [attr.data-cy]="'unsubscribe-topic-' + topic().id"
    class="mdd-btn mdd-btn--primary unsubscribe-btn"
    type="button"
    [disabled]="pending()"
    (click)="onUnsubscribe()"
  >
    Se désabonner
  </button>
</article>
