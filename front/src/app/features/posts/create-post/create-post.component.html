<section class="create-post-screen">
  <header class="create-post-header">
    <a class="back-link" routerLink="/feed" aria-label="Retour aux articles">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1>Créer un article</h1>
  </header>

  <form class="create-post-form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Sélectionner un thème</mat-label>
      <mat-select formControlName="topicId" [disabled]="loadingTopics">
        <mat-option *ngFor="let topic of topics" [value]="topic.id">{{ topic.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Titre de l'article</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contenu de l'article</mat-label>
      <textarea matInput formControlName="content" rows="8"></textarea>
    </mat-form-field>

    <button mat-flat-button type="submit" class="mdd-btn mdd-btn--primary submit-btn" [disabled]="submitting">
      Créer
    </button>

    <p class="create-post-error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</section>
