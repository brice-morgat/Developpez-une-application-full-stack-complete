<section class="login-page">
  <a class="back-link" routerLink="/"><mat-icon>arrow_back</mat-icon></a>
  <img class="mobile-auth-logo" src="assets/logo_p6.png" alt="MDD logo" />
  <mat-card class="login-card">
    <h1>Se connecter</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>E-mail ou nom d'utilisateur</mat-label>
        <input matInput formControlName="identifier" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <p class="error" *ngIf="(error$ | async) as error">{{ error }}</p>

      <button class="login-btn" mat-raised-button color="primary" type="submit" [disabled]="form.invalid || (loading$ | async)">
        Se connecter
      </button>
    </form>
  </mat-card>
</section>
