@if (showMainHeader) {
  <header class="app-topbar">
    <a class="logo-link" routerLink="/feed" aria-label="Accueil MDD">
      <img src="assets/logo_p6.png" alt="MDD logo" />
    </a>

    <nav class="desktop-nav">
      <a data-cy="nav-feed" routerLink="/feed" routerLinkActive="active">Articles</a>
      <a data-cy="nav-topics" routerLink="/topics" routerLinkActive="active">Thèmes</a>
      <a data-cy="nav-profile" routerLink="/profile" routerLinkActive="active" class="avatar-link" aria-label="Profil">
        <mat-icon>account_circle</mat-icon>
      </a>
      <button data-cy="logout-button" class="desktop-logout" type="button" (click)="logout()">Se déconnecter</button>
    </nav>

    <button class="mobile-menu-btn" type="button" (click)="toggleMobileMenu()" aria-label="Ouvrir le menu">
      <mat-icon>menu</mat-icon>
    </button>
  </header>
}

@if (showAuthHeader) {
  <header class="auth-topbar">
    <img src="assets/logo_p6.png" alt="MDD logo" />
  </header>
}

@if (mobileMenuOpen) {
  <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  <aside class="mobile-drawer">
    <nav class="mobile-nav">
      <a data-cy="mobile-nav-feed" routerLink="/feed" routerLinkActive="active" (click)="closeMobileMenu()">Articles</a>
      <a data-cy="mobile-nav-topics" routerLink="/topics" routerLinkActive="active" (click)="closeMobileMenu()">Thèmes</a>
      <a data-cy="mobile-nav-profile" routerLink="/profile" routerLinkActive="active" (click)="closeMobileMenu()">Profil</a>
      <button data-cy="mobile-logout-button" class="logout-btn" type="button" (click)="logout()">Se déconnecter</button>
    </nav>

    <a routerLink="/profile" class="mobile-avatar-link" aria-label="Profil" (click)="closeMobileMenu()">
      <mat-icon>account_circle</mat-icon>
    </a>
  </aside>
}

<main class="page-shell">
  <router-outlet></router-outlet>
</main>
