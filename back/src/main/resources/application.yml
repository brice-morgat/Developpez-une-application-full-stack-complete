spring:
  application:
    name: mdd-api
  datasource:
    url: jdbc:mysql://localhost:3306/db_mdd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  jwt:
    secret: ${JWT_SECRET:replace-with-long-secret-key-for-dev-only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

