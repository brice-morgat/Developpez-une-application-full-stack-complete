spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_mdd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  jwt:
    secret: ${JWT_SECRET:replace-with-long-secret-key-for-dev-only}
    expiration-ms: 86400000
